# FE DRAFT of the H1 / X16 contract — NOT the source of truth.
# The frontend's stubs (src/mocks) and generated types (src/api/schema.d.ts) are built from this file
# until the backend publishes its FastAPI OpenAPI schema. Then run:
#   OPENAPI_URL=https://<api-host>/openapi.json npm run gen:api
# and delete this file. Every shape here is a proposal for BE to accept, rename or reject.
openapi: 3.1.0
info:
  title: SDDG API (frontend draft)
  version: 0.1.0-draft
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /me/consent:
    get:
      summary: Current AI-processing consent (NFR5d)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
    post:
      summary: Record consent with timestamp and policy version (X8)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentCreate' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
  /projects:
    get:
      summary: Projects the caller is a member of (FR3c)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } }
    post:
      summary: Create a project; the creator becomes Owner (FR3a)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '409': { description: Name already used by this owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { description: Not found or no access (NFR4), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      summary: Rename the project (Owner only; other members get 404)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRename' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '409': { description: Name already used by this owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete the project and everything in it (Owner only); 422 "Type the project name to confirm."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDelete' } } }
      responses:
        '204': { description: Deleted }
        '422': { description: confirm_name is not the project's name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/archive:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Archive the project (Owner only, idempotent)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
    delete:
      summary: Reopen an archived project (Owner only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /projects/{project_id}/client:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    patch:
      summary: Set the project's client name and contact e-mail (Owner only); a blank field clears it
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectClient' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '422': { description: Invalid e-mail address }
  /projects/{project_id}/documents:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: List documents uploaded to a project
      responses:
        '200': { description: List of project documents, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectDocument' } } } } }
    post:
      summary: Upload a PDF or DOCX document and start extraction
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { description: 'The PDF or DOCX file (sent as FormData)' } }
      responses:
        '202': { description: Upload accepted and extraction started, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentUploadResponse' } } } }
  /projects/{project_id}/documents/{document_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: document_id, in: path, required: true, schema: { type: string } }
    delete:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties: { deleted: { type: boolean }, id: { type: string } }
  /projects/{project_id}/members:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Everyone in the project with their role and join date (any member, FR24c)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } } }
        '404': { description: Not a member, or no such project }
  /projects/{project_id}/members/{member_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: member_id, in: path, required: true, schema: { type: string }, description: The member's user id }
    patch:
      summary: Change a member's role (Owner only); applies on their next request
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemberRoleUpdate' } } }
      responses:
        '200': { description: The members after the change, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } } }
        '403': { description: Not an Owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Would leave the project without an Owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Remove a member (Owner only), or leave the project (your own id, any member)
      responses:
        '204': { description: Removed; access stops on their next request }
        '403': { description: Not an Owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Would leave the project without an Owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/inputs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Submit pasted requirement text (FR1a) and start extraction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InputCreate' } } }
      responses:
        '202': { description: Extraction queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/statements:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Requirement statements R-001… (FR4g)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RequirementStatement' } } } }
    post:
      summary: Add a requirement (next R-number). Clears the confirmation and the building blocks.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementWrite' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/RequirementStatement' } } } }
  /projects/{project_id}/statements/{statement_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: statement_id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Edit a requirement; 422 "Requirement text can't be empty."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementWrite' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequirementStatement' } } } }
    delete:
      responses:
        '204': { description: Deleted }
  /projects/{project_id}/flags:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Requirement quality flags (issue #34). Advisory only; never blocks anything.
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, resolved] } }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/summary:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Per requirement flag counts, for the flag icon next to each statement
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FlagSummary' } } } }
  /projects/{project_id}/flags/{flag_id}/resolve:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/{flag_id}/reopen:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/{flag_id}/apply-fix:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Replace the requirement text with the suggestion and resolve the flag; 409 if there is no suggestion
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/items:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Extracted items, paginated (FR5a)
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ItemCategory' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ItemPage' } } } }
  /projects/{project_id}/items/{item_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: item_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit an item; origin becomes user-edited (FR5b) and confirmation is cleared (FR5e)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractedItem' } } } }
  /projects/{project_id}/confirmation:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Confirm the current extraction (FR5e)
      responses:
        '201': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /projects/{project_id}/generations:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Start a generation run with a locked diagram-type selection (FR9d)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerationCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: Extraction not confirmed (FR5e), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/coverage:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Requirement coverage (FR20, any member); only the latest version of each diagram counts
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequirementCoverage' } } } }
  /projects/{project_id}/report.html:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Combined project report (any member) as one self-contained, print-styled HTML page; print it to save a PDF
      responses:
        '200': { description: HTML page, content: { text/html: { schema: { type: string } } } }
  /projects/{project_id}/stories:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every story (by S-number) and the project's members, for the assignee picker (any member)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StoryList' } } } }
    post:
      summary: Add a story; 422 with a readable detail, e.g. "A story must link to at least one requirement."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StoryCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Story' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/stories/{story_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: story_id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Change any of a story's fields; a field left out is unchanged
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StoryUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Story' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a story; its S-number is not reused
      responses:
        '204': { description: Deleted }
  /projects/{project_id}/design:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every system design section, in order (a section unlocks when the one before it is confirmed)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DesignSectionList' } } } }
  /projects/{project_id}/design/{kind}/draft-jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DesignKind' }]
    post:
      summary: AI draft of the section from the confirmed requirements; on success it replaces the content as a draft
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Requirements not confirmed, section locked, or a draft already running', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/design/{kind}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DesignKind' }]
    put:
      summary: Save the section's content as a draft (a confirmed section goes back to draft); 422 with a readable detail
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DesignSectionUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DesignSection' } } } }
        '409': { description: Section locked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/design/{kind}/confirm:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/DesignKind' }]
    post:
      summary: Confirm the section; 422 when it is empty, out of date or incomplete for its kind
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DesignSection' } } } }
        '409': { description: Section locked, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/diagrams:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DiagramSummary' } } } }
  /projects/{project_id}/diagrams/export:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: The project's diagrams as one ZIP (PNG, SVG, PDF and source code for each, plus README.txt; no PDF for Mermaid)
      parameters:
        - { name: versions, in: query, required: false, description: 'all (default) = every version; latest = newest version of each diagram', schema: { type: string, enum: [all, latest], default: all } }
      responses:
        '200': { description: ZIP file, content: { application/zip: { schema: { type: string, format: binary } } } }
        '404': { description: The project has no diagrams yet, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'versions is not all/latest, or the all-versions ZIP is over the version cap (ZIP_MAX_VERSIONS, default 30)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /jobs/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Job status, polled by the progress indicator (FR10g)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  /diagrams/{diagram_id}:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: One diagram version. The picture itself is the PNG from /export.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
  /diagrams/{diagram_id}/revisions:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    post:
      summary: Edit a diagram in plain language ("rename Browse canteen menu to Browse menu card"). Returns the new version; the old one is kept.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RevisionCreate' } } }
      responses:
        '201': { description: New version, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
        '422': { description: The instruction could not be applied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/export:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: The rendered diagram as PNG (shown in the viewer; FR18a — 2x, capped at 8000 px), SVG or PDF, downloaded by Export. Pictures are drawn with the diagram's saved style (#38).
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [png, svg, pdf, source] } }
      responses:
        '200':
          description: File
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { description: 'format=source: the diagram code (text/x-plantuml, text/vnd.graphviz or text/x-mermaid)', schema: { type: string } }
        '422': { description: Unsupported format, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/layout:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: Element positions and the lines between them, for moving elements by hand (#37). Positions are element centres.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramLayout' } } } }
    post:
      summary: Save moved elements. Returns the new version; the one it came from is kept.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LayoutUpdate' } } }
      responses:
        '201': { description: New version, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
        '422': { description: Not an element of this diagram, or a position is not a number, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/flags/{flag_id}/answer:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: flag_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Answer a flag's question (#34). For an untestable flag the answer also fills in the suggested requirement.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FlagAnswer' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/tests/requirements:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every requirement with its test-design summary, plus the project's running test job if there is one
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRequirementList' } } } }
  /projects/{project_id}/tests/requirements/{statement_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/StatementId' }
    get:
      summary: One requirement's test design - criteria, conditions with classes and boundaries, flows, drafts, open question
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestDesign' } } } }
  /projects/{project_id}/tests/criteria-jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: AI request 1 - acceptance criteria, conditions, flows and questions for the chosen requirements (5 per AI call). Replaces an earlier design.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriteriaJobCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: A Tests job is already running for this project, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unknown requirement, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/conditions/{condition_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: condition_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a condition. Classes, boundaries and draft cases are recomputed in code - no AI call.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConditionUpdate' } } }
      responses:
        '200': { description: The requirement's updated design, content: { application/json: { schema: { $ref: '#/components/schemas/TestDesign' } } } }
        '422': { description: Invalid limits or values, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/criteria/{criterion_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: criterion_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit an acceptance criterion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriterionUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Criterion' } } } }
  /projects/{project_id}/tests/step-jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: AI request 2 - preconditions, steps and expected results for kept draft cases only (6 per AI call)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepJobCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: No kept draft cases to write, or a Tests job is already running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/cases:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every test case with its freshness and last result
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } }
    post:
      summary: Add a test case by hand
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /projects/{project_id}/tests/cases/{case_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    patch:
      summary: Keep or discard a draft, or edit a case's text
      description: A draft only accepts `kept`; its other fields can be edited once its steps are written (status ready).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
        '409': { description: A draft can only be kept or discarded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Runs, newest first, with their result counts
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestRunSummary' } } } }
    post:
      summary: Start a manual run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestRunCreate' } } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
        '422': { description: The selection is empty, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs/selection:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Which ready cases each run mode would pick, and why
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunSelection' } } } }
  /projects/{project_id}/tests/runs/{run_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
  /projects/{project_id}/tests/runs/{run_id}/results/{case_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/CaseId' }
    put:
      summary: Mark one case in an open run. Who marked it and when are recorded.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestResultUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '409': { description: The run is finished, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs/{run_id}/finish:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      summary: Finish a run. It is kept so later runs can be compared with it.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
  /diagrams/{diagram_id}/style:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: The diagram's look (#38). A version with no saved style uses the nearest earlier version's, else the default.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } } }
    put:
      summary: Save the diagram's look. Only drawing changes; the diagram's elements and relationships never do, so no new version is made.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } } }
        '422': { description: Invalid colour, direction or font size, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/preview:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    post:
      summary: Draw the diagram with a style that is not saved yet, for the live preview while customising (#38)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } }
      responses:
        '200': { description: File, content: { image/png: { schema: { type: string, format: binary } } } }
        '422': { description: Invalid colour, direction or font size, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ---- Admin console (Nitin) ----
  /me:
    get:
      summary: Who the caller is and whether they are a System Administrator (shows the Admin console button)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
  /admin/users:
    get:
      summary: Users, most recently active first, 25 per page; q matches the email (administrators only, else 403)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/users/{user_id}/deactivate:
    parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Block sign-in straight away; their projects are kept. 409 for yourself or the only owner of a shared project
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/users/{user_id}/reactivate:
    parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Let a deactivated user sign in again
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/usage:
    get:
      summary: Active users, projects, storage and generation time of the last 7 days (administrators only, else 403)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUsage' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/errors:
    get:
      summary: Recorded errors, newest first, 25 per page; filter by type and severity. Kinds and IDs only, never document text (administrators only, else 403)
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/AdminErrorType' } }
        - { name: severity, in: query, required: false, schema: { $ref: '#/components/schemas/AdminErrorSeverity' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminErrorPage' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/activity:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: The project's activity log (FR22), newest first, 25 per page. Owners and administrators only (Editor or Viewer 403, not a member 404). IDs and small values only, never requirement text.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string, enum: [all, members, requirements, diagrams, comments], default: all } }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 200 }, description: Only this person's actions (a user id from actors) }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '403': { description: Not an Owner or administrator, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not a member, or no such project }
  /notifications:
    get:
      summary: The bell (FR24a, FR32). Newest 50 notifications and the unread count.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } } }
  /notifications/unread-count:
    get:
      summary: Just the unread count, cheap enough for the bell to poll
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UnreadCount' } } } }
  /notifications/read-all:
    post:
      summary: Mark every notification read
      responses:
        '204': { description: Done }
  /notifications/{notification_id}/read:
    parameters: [{ name: notification_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Mark one notification read (idempotent)
      responses:
        '204': { description: Done }
        '404': { description: Not yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/invitations:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: The project's open invitations. Only Owners and administrators get the link tokens.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } }
    post:
      summary: Invite someone by email (FR24a). Owners and administrators only; expires after 7 days.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreate' } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '403': { description: A member who is not an Owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already a member, or already invited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Not a valid email address, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/invitations/{invitation_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: invitation_id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke an open invitation
      responses:
        '204': { description: Revoked }
        '404': { description: Not open, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /invitations/{invitation_id}/accept:
    parameters: [{ name: invitation_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Accept an invitation from the bell. Only the person invited may.
      responses:
        '200': { description: Joined, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { description: Not yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Revoked or expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /invitations/accept:
    post:
      summary: Accept through the invitation's link (the token in it)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAccept' } } }
      responses:
        '200': { description: Joined, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { description: Not yours, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Revoked or expired, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/drift:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: FR17d. How this version of an edited diagram drifted from the requirements (nothing is stored)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Drift' } } } }
  /projects/{project_id}/traceability/naming:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: FR17e. Model items the latest version of each diagram names differently (matched by model item ID)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NamingReport' } } } }
  /projects/{project_id}/traceability/naming/apply:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Apply this name to all diagrams; a new version of each diagram that named the item differently
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NamingApply' } } }
      responses:
        '200': { description: The new versions, content: { application/json: { schema: { $ref: '#/components/schemas/NamingApplied' } } } }
        '403': { description: A Viewer cannot rename across diagrams, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: No diagram uses that model item, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Empty name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: Supabase access token }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    DiagramId: { name: diagram_id, in: path, required: true, schema: { type: string } }
    StatementId: { name: statement_id, in: path, required: true, schema: { type: string } }
    CaseId: { name: case_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    DesignKind: { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/DesignKind' } }
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Plain-language message safe to show the user }
        code: { type: string }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok] } }
    Consent:
      type: object
      required: [consented, current_policy_version]
      properties:
        consented: { type: boolean, description: True only if consent matches the current AI section of the policy }
        policy_version: { type: [string, 'null'] }
        consented_at: { type: [string, 'null'], format: date-time }
        current_policy_version: { type: string }
    ConsentCreate:
      type: object
      required: [policy_version]
      properties: { policy_version: { type: string } }
    Role: { type: string, enum: [owner, editor, viewer] }
    Project:
      type: object
      required: [id, name, role, is_owner, archived_at, archived_by, client_name, contact_email, created_at, updated_at, statement_count, item_count, extraction, confirmed, diagram_count, extracted_nodes]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/Role' }
        is_owner: { type: boolean, description: Only the owner may rename, archive, delete or set the client }
        archived_at: { type: [string, 'null'], format: date-time }
        archived_by: { type: [string, 'null'], description: E-mail of the user who archived it }
        client_name: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        statement_count: { type: integer }
        item_count: { type: integer }
        extraction: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: Latest extraction job }
        confirmed: { type: boolean, description: The requirements are confirmed (cleared by any requirement change) }
        confirmed_at: { type: [string, 'null'], format: date-time }
        diagram_count: { type: integer }
        open_flag_count: { type: integer }
        extracted_nodes: { type: array, items: { type: string }, description: 'Extraction nodes already run on the confirmed requirements (actors, entities, ...)' }
        document_count: { type: integer }
        document_page_count: { type: integer }
    ProjectDocument:
      type: object
      required: [id, project_id, filename, storage_path, content_type, size_bytes, page_count, status, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        filename: { type: string }
        storage_path: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        page_count: { type: integer }
        status: { type: string, enum: [uploaded, processing, processed, failed] }
        warning: { type: [string, 'null'] }
        skipped_pages: { type: array, items: { type: integer } }
        job_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentUploadResponse:
      type: object
      required: [document, job]
      properties:
        document: { $ref: '#/components/schemas/ProjectDocument' }
        job: { $ref: '#/components/schemas/Job' }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        client_name: { type: [string, 'null'], maxLength: 100 }
        contact_email: { type: [string, 'null'], maxLength: 254 }
    ProjectRename:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 100 } }
    ProjectDelete:
      type: object
      required: [confirm_name]
      properties: { confirm_name: { type: string, maxLength: 200, description: The project's exact name } }
    Member:
      type: object
      required: [user_id, email, role, joined_at, is_creator, is_you]
      properties:
        user_id: { type: string }
        email: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: [string, 'null'], format: date-time }
        is_creator: { type: boolean, description: Created the project }
        is_you: { type: boolean, description: This member is the caller }
    MemberRoleUpdate:
      type: object
      required: [role]
      properties: { role: { $ref: '#/components/schemas/Role' } }
    ProjectClient:
      type: object
      properties:
        client_name: { type: [string, 'null'], maxLength: 100 }
        contact_email: { type: [string, 'null'], maxLength: 254 }
    InputCreate:
      type: object
      required: [text]
      properties: { text: { type: string, minLength: 1 } }
    SourceLocation:
      type: object
      required: [document]
      properties:
        document: { type: string }
        page: { type: [integer, 'null'] }
        paragraph: { type: [integer, 'null'] }
    RequirementStatement:
      type: object
      required: [id, ref, text, source]
      properties:
        id: { type: string }
        ref: { type: string, description: Project-unique, never reused, e.g. R-001 }
        text: { type: string }
        label: { type: [string, 'null'], description: Label the input already carried, e.g. FR3 }
        source_label: { type: [string, 'null'] }
        metadata:
          type: [object, 'null']
          additionalProperties: true
          properties: { role: { type: string }, goal: { type: string }, reason: { type: string }, structured: { type: boolean } }
        source: { $ref: '#/components/schemas/SourceLocation' }
        revision: { type: integer, minimum: 1, description: 'Counts up on every save, from 1. The edit conflict check compares it with the revision an edit was based on' }
    StatementWrite:
      type: object
      properties:
        text: { type: string, maxLength: 2000 }
        label: { type: [string, 'null'], enum: [functional, non_functional, user_story, constraint, unknown, null] }
    FlagSummary:
      type: object
      required: [statement_id, statement_ref, total, open, types]
      properties:
        statement_id: { type: string }
        statement_ref: { type: string }
        total: { type: integer }
        open: { type: integer }
        types: { type: array, items: { $ref: '#/components/schemas/FlagType' } }
    ItemCategory:
      type: string
      enum: [actor, entity, process, data_flow, data_store, interaction, relationship]
    ItemOrigin:
      type: string
      enum: [system-extracted, user-added, user-edited]
    ItemQualifier:
      type: string
      enum: [minimal, low-confidence, incomplete, order-uncertain, needs-review]
    ExtractedItem:
      type: object
      required: [id, category, name, origin, qualifiers, statement_ids]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/ItemCategory' }
        name: { type: string }
        description: { type: [string, 'null'] }
        origin: { $ref: '#/components/schemas/ItemOrigin' }
        qualifiers: { type: array, items: { $ref: '#/components/schemas/ItemQualifier' } }
        statement_ids: { type: array, items: { type: string }, description: Source requirement statement IDs }
        source_item_id: { type: [string, 'null'], description: For flows, interactions, relationships }
        target_item_id: { type: [string, 'null'] }
        relation_type: { type: [string, 'null'], description: e.g. association, include, extend, generalization }
        revision: { type: integer, minimum: 1, description: Counts up on every save, from 1 }
    ItemPage:
      type: object
      required: [items, total, page, page_size, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExtractedItem' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        counts: { type: object, additionalProperties: { type: integer }, description: Item count per category }
    ItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
    DiagramType:
      type: string
      enum: [use_case, class, activity, sequence, dfd, component, package]
      description: package = drawn from the confirmed subsystem decomposition (Design step), never generated
    GenerationCreate:
      type: object
      required: [diagram_types]
      properties:
        diagram_types: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DiagramType' } }
    JobStatus: { type: string, enum: [queued, running, waiting, succeeded, failed], description: 'waiting = the AI provider is at its rate limit; the job resumes by itself' }
    Job:
      type: object
      required: [id, kind, status, progress]
      properties:
        id: { type: string }
        kind: { type: string, enum: [extraction, generation, test_criteria, test_steps, design_goals, design_decomposition] }
        status: { $ref: '#/components/schemas/JobStatus' }
        queue_position: { type: [integer, 'null'] }
        progress:
          type: object
          required: [step, total, label]
          properties:
            step: { type: integer }
            total: { type: integer }
            label: { type: string, description: 'e.g. "Generating diagram 1 of 1"' }
        diagram_types: { type: array, items: { $ref: '#/components/schemas/DiagramType' } }
        diagram_ids: { type: array, items: { type: string } }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    DiagramSummary:
      type: object
      required: [id, type, title, created_at, parent_id, instruction]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/DiagramType' }
        title: { type: string }
        created_at: { type: string, format: date-time }
        parent_id: { type: [string, 'null'], description: The version this one was edited from; null for a fresh generation }
        instruction: { type: [string, 'null'], description: The edit request that produced this version; null for a fresh generation }
        revision: { type: integer, minimum: 1, description: 1 for a fresh generation; each edited version is its parent's revision plus one }
    DiagramElement:
      type: object
      required: [element_id, kind, label, statement_ids]
      properties:
        element_id: { type: string, description: Matches data-element-id in the SVG }
        model_item_id: { type: [string, 'null'] }
        kind: { type: string }
        label: { type: string }
        statement_ids: { type: array, items: { type: string } }
    Diagram:
      allOf:
        - $ref: '#/components/schemas/DiagramSummary'
        - type: object
          properties:
            svg: { type: [string, 'null'], description: 'Rendered SVG; elements are wrapped in g with data-element-id' }
            elements: { type: array, items: { $ref: '#/components/schemas/DiagramElement' } }
            statements: { type: array, items: { $ref: '#/components/schemas/RequirementStatement' }, description: Requirements this diagram traces to }
    RevisionCreate:
      type: object
      required: [instruction]
      properties:
        instruction: { type: string, minLength: 1, maxLength: 500 }
    LayoutDirection:
      type: string
      enum: [auto, TB, LR]
      description: auto keeps the direction the generator chose; TB is top to bottom, LR left to right
    DiagramStyle:
      type: object
      required: [preset, background, fill, text, line, direction, font_size]
      properties:
        preset: { type: [string, 'null'], enum: [default, high_contrast, dark, blueprint, warm, null], description: Preset the colours came from; null once a colour is edited by hand }
        background: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Canvas }
        fill: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Element boxes }
        text: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: All labels }
        line: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Borders and arrows }
        direction: { $ref: '#/components/schemas/LayoutDirection' }
        font_size: { type: integer, minimum: 8, maximum: 24, description: Points }
    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    LayoutElement:
      type: object
      required: [id, kind, label, x, y]
      properties:
        id: { type: string }
        kind: { type: string, description: 'e.g. actor, use_case, class, process, start, decision' }
        label: { type: string }
        x: { type: number, description: Centre of the element }
        y: { type: number, description: Centre of the element }
    LayoutLine:
      type: object
      required: [id, kind, source, target]
      properties:
        id: { type: string }
        kind: { type: string, description: 'e.g. association, include, extend, message, data_flow, flow, or a class relation type' }
        source: { type: string, description: Element id the line starts at }
        target: { type: string, description: Element id the line ends at }
        label: { type: [string, 'null'], description: 'Text drawn on the line: a flow name, message, relation name, dependency label, transition event or decision guard; null when the line has none' }
    DiagramLayout:
      type: object
      required: [diagram_id, type, saved, elements, lines]
      properties:
        diagram_id: { type: string }
        type: { $ref: '#/components/schemas/DiagramType' }
        saved: { type: boolean, description: True when this version has positions moved by hand; false means the default grid }
        elements: { type: array, items: { $ref: '#/components/schemas/LayoutElement' } }
        lines: { type: array, items: { $ref: '#/components/schemas/LayoutLine' } }
    LayoutUpdate:
      type: object
      required: [positions]
      properties:
        positions: { type: object, description: Only the elements that moved, by element id, additionalProperties: { $ref: '#/components/schemas/Point' } }
    RequirementCoverage:
      type: object
      required: [total, with_diagrams, not_represented, not_represented_refs, with_open_flags, with_tests, rows]
      properties:
        total: { type: integer }
        with_diagrams: { type: integer }
        not_represented: { type: integer }
        not_represented_refs: { type: array, items: { type: string } }
        with_open_flags: { type: integer }
        with_tests: { type: [integer, 'null'], description: Not computed yet (null) }
        rows: { type: array, items: { $ref: '#/components/schemas/RequirementCoverageRow' } }
    RequirementCoverageRow:
      type: object
      required: [id, ref, text, label, source, diagrams, open_flags, tests]
      properties:
        id: { type: string }
        ref: { type: string }
        text: { type: string }
        label: { type: [string, 'null'] }
        source: { type: string, description: Source document name }
        diagrams: { type: array, items: { $ref: '#/components/schemas/CoveringDiagram' } }
        open_flags: { type: array, items: { $ref: '#/components/schemas/FlagType' } }
        tests: { type: [integer, 'null'], description: Not computed yet (null) }
    CoveringDiagram:
      type: object
      required: [id, type, title, version]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/DiagramType' }
        title: { type: string }
        version: { type: integer, description: Version number of the latest version (1 = first generation) }
    DesignKind: { type: string, enum: [goals, decomposition], description: Section kinds in order; only implemented kinds exist }
    DesignSection:
      type: object
      required: [kind, title, status, version, content, derived, stale, locked, job, updated_at]
      properties:
        kind: { $ref: '#/components/schemas/DesignKind' }
        title: { type: string }
        status: { type: string, enum: [empty, draft, confirmed] }
        version: { type: integer, description: 0 when empty }
        content: { type: [object, 'null'], additionalProperties: true, description: 'Per kind: goals -> DesignGoals, decomposition -> DesignDecomposition' }
        derived: { type: [object, 'null'], additionalProperties: true, description: 'Computed from the saved content. Per kind: goals -> DesignGoalsDerived, decomposition -> DesignDecompositionDerived' }
        stale: { type: boolean, description: A requirement it cites changed or was deleted since it was last written }
        locked: { type: boolean, description: The previous section is not confirmed yet }
        job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: The latest AI draft job of this section }
        updated_at: { type: [string, 'null'], format: date-time }
    DesignSectionList:
      type: object
      required: [sections]
      properties: { sections: { type: array, items: { $ref: '#/components/schemas/DesignSection' } } }
    DesignSectionUpdate:
      type: object
      required: [content]
      properties: { content: { type: object, additionalProperties: true } }
    DesignGoals:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          description: Array order is the ranking (first = most important)
          items:
            type: object
            required: [name, reason, statement_ids]
            properties:
              name: { type: string, description: One of the 28 lecture 24 design goals }
              reason: { type: string, maxLength: 300 }
              statement_ids: { type: array, items: { type: string } }
    DesignGoalsDerived:
      type: object
      required: [groups, conflicts]
      properties:
        groups:
          type: object
          required: [client, end_user, developer, other]
          properties:
            client: { type: array, items: { type: string } }
            end_user: { type: array, items: { type: string } }
            developer: { type: array, items: { type: string } }
            other: { type: array, items: { type: string } }
        conflicts:
          type: array
          items:
            type: object
            required: [a, b, pair]
            properties: { a: { type: string }, b: { type: string }, pair: { type: string } }
    DesignDecomposition:
      type: object
      required: [architecture, subsystems]
      properties:
        architecture: { type: string, enum: [closed, open], description: 'closed: a layer calls only the layer directly below; open: any lower layer' }
        subsystems:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [id, name, description, layer, services, classes, depends_on, statement_ids]
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$', description: 'Short slug, unique; kept when the name changes' }
              name: { type: string, minLength: 1, maxLength: 80 }
              description: { type: string, maxLength: 500 }
              layer: { type: integer, minimum: 1, description: 1 = top layer; larger = lower }
              services:
                type: array
                items:
                  type: object
                  required: [name, operations]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 120 }
                    operations: { type: array, items: { type: string, minLength: 1, maxLength: 120 } }
              classes: { type: array, items: { type: string }, description: Names of extracted classes/entities it owns; a class belongs to at most one subsystem }
              depends_on: { type: array, items: { type: string }, description: Ids of other subsystems }
              statement_ids: { type: array, items: { type: string } }
    DesignDecompositionDerived:
      type: object
      required: [layers, subsystems, cohesion, warnings, package_diagram]
      properties:
        layers:
          type: array
          description: Partitions = subsystems sharing a layer
          items:
            type: object
            required: [layer, subsystem_ids]
            properties: { layer: { type: integer }, subsystem_ids: { type: array, items: { type: string } } }
        subsystems:
          type: array
          items:
            type: object
            required: [id, cohesion, coupling]
            properties:
              id: { type: string }
              cohesion: { type: [number, 'null'], description: 'internal / (internal + crossing) relations touching it; null when it touches none' }
              coupling: { type: integer, description: Distinct other subsystems linked by a crossing relation or depends_on }
        cohesion: { type: [number, 'null'], description: Whole decomposition; null without relations }
        warnings:
          type: array
          items:
            type: object
            required: [code, message, subsystem_ids]
            properties:
              code: { type: string, enum: [too_many_subsystems, too_many_layers, upward_dependency, skipped_layer, unassigned_class, empty_subsystem] }
              message: { type: string }
              subsystem_ids: { type: array, items: { type: string }, description: 'upward_dependency and skipped_layer: [from, to]; empty_subsystem: [id]' }
        package_diagram: { type: string, description: PlantUML source; stored as a package diagram when the section is confirmed }
    StoryPriority: { type: string, enum: [must, should, could, wont] }
    StoryStatus: { type: string, enum: [todo, in_progress, done] }
    Story:
      type: object
      required: [id, ref, role, goal, reason, priority, estimate, status, assignee_id, assignee_email, confirmations, statement_ids, created_at, updated_at]
      properties:
        id: { type: string }
        ref: { type: string, description: 'Project-unique, never reused, e.g. S-001' }
        role: { type: string }
        goal: { type: string }
        reason: { type: string }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], description: Story points }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        assignee_email: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, description: Acceptance criteria }
        statement_ids: { type: array, items: { type: string }, description: Empty once its requirements were deleted }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoryCreate:
      type: object
      required: [role, goal, reason, statement_ids]
      properties:
        role: { type: string, minLength: 1, maxLength: 300 }
        goal: { type: string, minLength: 1, maxLength: 300 }
        reason: { type: string, minLength: 1, maxLength: 300 }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, maxItems: 20 }
        statement_ids: { type: array, items: { type: string }, minItems: 1 }
    StoryUpdate:
      type: object
      description: A field left out is unchanged; null clears estimate or assignee_id
      properties:
        role: { type: string, minLength: 1, maxLength: 300 }
        goal: { type: string, minLength: 1, maxLength: 300 }
        reason: { type: string, minLength: 1, maxLength: 300 }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, maxItems: 20 }
        statement_ids: { type: array, items: { type: string }, minItems: 1 }
    StoryList:
      type: object
      required: [stories, members]
      properties:
        stories: { type: array, items: { $ref: '#/components/schemas/Story' } }
        members:
          type: array
          items: { type: object, required: [id, email], properties: { id: { type: string }, email: { type: string } } }
    FlagType: { type: string, enum: [ambiguous, incomplete, conflict, untestable] }
    Flag:
      type: object
      required: [id, statement_id, statement_ref, type, reason, status, has_suggestion, suggestion]
      properties:
        id: { type: string }
        statement_id: { type: string }
        statement_ref: { type: string }
        type: { $ref: '#/components/schemas/FlagType' }
        statement_text: { type: string }
        reason: { type: string }
        trigger_text: { type: [string, 'null'] }
        related_statement_id: { type: [string, 'null'] }
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        has_suggestion: { type: boolean }
        suggestion: { type: string, description: 'The suggested requirement text, or "No suggestion available."' }
        status: { type: string, enum: [open, resolved] }
        resolved_by: { type: [string, 'null'] }
        resolved_at: { type: [string, 'null'], format: date-time }
    FlagAnswer:
      type: object
      required: [answer]
      properties: { answer: { type: string, minLength: 1, maxLength: 1000 } }
    TestRequirementSummary:
      type: object
      required: [statement_id, ref, text, designed, stale, criteria_count, draft_count, kept_count, ready_count, boundary_count, open_question, open_flags]
      properties:
        statement_id: { type: string }
        ref: { type: string }
        text: { type: string }
        label: { type: [string, 'null'] }
        designed: { type: boolean, description: AI request 1 has run for this requirement }
        stale: { type: boolean, description: The requirement text changed after its design was made }
        criteria_count: { type: integer }
        draft_count: { type: integer, description: Generated cases still waiting for steps }
        kept_count: { type: integer, description: Drafts that will get steps }
        ready_count: { type: integer, description: Cases with steps written }
        boundary_count: { type: integer, description: Boundary values across this requirement's conditions }
        open_question: { type: boolean, description: An open untestable flag is waiting for an answer }
        open_flags: { type: array, items: { $ref: '#/components/schemas/FlagType' }, description: Types of the requirement's open flags }
    TestRequirementList:
      type: object
      required: [requirements, active_job]
      properties:
        requirements: { type: array, items: { $ref: '#/components/schemas/TestRequirementSummary' } }
        active_job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: A queued or running test job }
    Criterion:
      type: object
      required: [id, given, when, then]
      properties:
        id: { type: string }
        given: { type: string }
        when: { type: string }
        then: { type: string }
    ConditionKind: { type: string, enum: [range, count, set] }
    EquivalenceClass:
      type: object
      required: [label, valid]
      properties:
        label: { type: string, description: 'e.g. "1–30", "< 1", "Surgery"' }
        valid: { type: boolean }
    BoundaryValue:
      type: object
      required: [value, valid]
      properties:
        value: { type: number }
        valid: { type: boolean, description: False when the system should reject this value }
    Condition:
      type: object
      required: [id, name, kind, description, values, invalid_values, classes, boundaries]
      properties:
        id: { type: string }
        name: { type: string, description: 'The input, e.g. days_ahead' }
        kind: { $ref: '#/components/schemas/ConditionKind' }
        description: { type: string }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }
        values: { type: array, items: { type: string }, description: Valid values of a set }
        invalid_values: { type: array, items: { type: string }, description: Values a set must reject }
        classes: { type: array, items: { $ref: '#/components/schemas/EquivalenceClass' } }
        boundaries: { type: array, items: { $ref: '#/components/schemas/BoundaryValue' } }
    Flow:
      type: object
      required: [id, kind, text]
      properties:
        id: { type: string }
        kind: { type: string, enum: [basic, alternate] }
        text: { type: string }
    PerformanceTarget:
      type: object
      required: [measure, limit, unit]
      properties:
        measure: { type: string }
        limit: { type: number }
        unit: { type: string }
        load: { type: [string, 'null'] }
    TestDesign:
      type: object
      required: [statement_id, ref, text, designed, stale, criteria, conditions, flows, performance_targets, drafts, question, open_flags]
      properties:
        statement_id: { type: string }
        ref: { type: string }
        text: { type: string }
        label: { type: [string, 'null'] }
        designed: { type: boolean }
        stale: { type: boolean }
        generated_at: { type: [string, 'null'], format: date-time }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        flows: { type: array, items: { $ref: '#/components/schemas/Flow' } }
        performance_targets: { type: array, items: { $ref: '#/components/schemas/PerformanceTarget' } }
        drafts: { type: array, items: { $ref: '#/components/schemas/TestCase' }, description: This requirement's generated cases }
        question: { oneOf: [{ $ref: '#/components/schemas/Flag' }, { type: 'null' }], description: The latest untestable flag }
        open_flags: { type: array, items: { $ref: '#/components/schemas/FlagType' } }
    CriteriaJobCreate:
      type: object
      required: [statement_ids]
      properties:
        statement_ids: { type: array, minItems: 1, maxItems: 30, items: { type: string } }
    ConditionUpdate:
      type: object
      properties:
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        values: { type: array, items: { type: string } }
        invalid_values: { type: array, items: { type: string } }
    CriterionUpdate:
      type: object
      required: [given, when, then]
      properties:
        given: { type: string, minLength: 1, maxLength: 500 }
        when: { type: string, minLength: 1, maxLength: 500 }
        then: { type: string, minLength: 1, maxLength: 500 }
    StepJobCreate:
      type: object
      properties:
        case_ids: { type: array, items: { type: string }, description: Defaults to every kept draft case }
    CaseTechnique: { type: string, enum: [EC, BVA, BVA+EC, Flow, NFR, AC, Manual] }
    CaseKind: { type: string, enum: [positive, negative, edge] }
    CasePriority: { type: string, enum: [high, medium, low] }
    ResultStatus: { type: string, enum: [pass, fail, blocked, skipped] }
    TestCase:
      type: object
      required: [id, number, statement_id, statement_ref, title, technique, kind, priority, status, kept, origin, test_data, covers, preconditions, steps, freshness, created_at]
      properties:
        id: { type: string }
        number: { type: string, description: 'Project-unique, never reused, e.g. TC-009' }
        statement_id: { type: string }
        statement_ref: { type: string }
        title: { type: string }
        technique: { $ref: '#/components/schemas/CaseTechnique' }
        kind: { $ref: '#/components/schemas/CaseKind' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        status: { type: string, enum: [draft, ready], description: ready once steps are written }
        kept: { type: boolean, description: False for a draft the user unticked }
        origin: { type: string, enum: [generated, manual] }
        outcome: { type: [string, 'null'], enum: [accepted, rejected, null], description: What the system should do with the test data }
        test_data: { type: object, additionalProperties: { type: [string, number] } }
        covers: { type: array, items: { type: string }, description: 'e.g. EC:days_ahead:high, BVA:days_ahead:31' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        expected: { type: [string, 'null'] }
        freshness: { type: string, enum: [current, out_of_date], description: out_of_date once the requirement text changes }
        last_result: { oneOf: [{ $ref: '#/components/schemas/ResultStatus' }, { type: 'null' }], description: Result in the newest run that marked this case }
        created_at: { type: string, format: date-time }
    TestCaseCreate:
      type: object
      required: [statement_id, title, kind, priority, steps, expected]
      properties:
        statement_id: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/CaseKind' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, minItems: 1, items: { type: string } }
        expected: { type: string, minLength: 1, maxLength: 1000 }
    TestCaseUpdate:
      type: object
      properties:
        kept: { type: boolean }
        title: { type: string, minLength: 1, maxLength: 200 }
        priority: { $ref: '#/components/schemas/CasePriority' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        expected: { type: string, minLength: 1, maxLength: 1000 }
    RunMode: { type: string, enum: [all, failed, regression, minimal, pick] }
    TestRunCreate:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        mode: { $ref: '#/components/schemas/RunMode' }
        case_ids: { type: array, items: { type: string }, description: Required for mode pick }
    RunTally:
      type: object
      required: [pass, fail, blocked, skipped, unmarked]
      properties:
        pass: { type: integer }
        fail: { type: integer }
        blocked: { type: integer }
        skipped: { type: integer }
        unmarked: { type: integer }
    TestRunSummary:
      type: object
      required: [id, name, mode, case_count, created_by, created_at, finished_at, tally]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { $ref: '#/components/schemas/RunMode' }
        case_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        tally: { $ref: '#/components/schemas/RunTally' }
    TestResult:
      type: object
      required: [case_id, status, marked_by, marked_at]
      properties:
        case_id: { type: string }
        status: { $ref: '#/components/schemas/ResultStatus' }
        note: { type: [string, 'null'] }
        marked_by: { type: string }
        marked_at: { type: string, format: date-time }
    TestRunItem:
      type: object
      required: [case, result]
      properties:
        case: { $ref: '#/components/schemas/TestCase' }
        result: { oneOf: [{ $ref: '#/components/schemas/TestResult' }, { type: 'null' }] }
    TestRun:
      allOf:
        - { $ref: '#/components/schemas/TestRunSummary' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TestRunItem' } }
    TestResultUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ResultStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }
    RunSelectionMode:
      type: object
      required: [case_ids, reasons, warning]
      properties:
        case_ids: { type: array, items: { type: string }, description: In the order the run will show them }
        reasons: { type: object, additionalProperties: { type: string }, description: Why each case was picked, by case id }
        warning: { type: [string, 'null'] }
    RunSelection:
      type: object
      required: [changed_refs, all, failed, regression, minimal]
      properties:
        changed_refs: { type: array, items: { type: string }, description: Requirements whose text changed since their cases were made }
        all: { $ref: '#/components/schemas/RunSelectionMode' }
        failed: { $ref: '#/components/schemas/RunSelectionMode' }
        regression: { $ref: '#/components/schemas/RunSelectionMode' }
        minimal: { $ref: '#/components/schemas/RunSelectionMode' }
    # ---- Admin console (Nitin) ----
    Me:
      type: object
      required: [id, email, is_admin]
      properties:
        id: { type: string }
        email: { type: string }
        is_admin: { type: boolean }
    AdminUser:
      type: object
      required: [id, email, is_admin, projects, last_seen_at, status]
      properties:
        id: { type: string }
        email: { type: string }
        is_admin: { type: boolean }
        projects: { type: integer, description: Projects they are a member of }
        last_seen_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, deactivated] }
    AdminUserPage:
      type: object
      required: [users, total, page, page_size]
      properties:
        users: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    UsageEvent:
      type: object
      required: [type, description, duration_seconds, at]
      properties:
        type: { type: string, enum: [slow, error, rate_limit] }
        description: { type: string, description: 'Built from the job kind, AI node and counts only, never requirement or error text' }
        duration_seconds: { type: number, nullable: true }
        at: { type: string, format: date-time }
    UsageGeneration:
      type: object
      required: [runs, median_seconds, p95_seconds, median_target_seconds, p95_target_seconds, median_ok, p95_ok]
      properties:
        runs: { type: integer, description: Finished generation runs in the window }
        median_seconds: { type: number, nullable: true }
        p95_seconds: { type: number, nullable: true }
        median_target_seconds: { type: integer }
        p95_target_seconds: { type: integer }
        median_ok: { type: boolean, nullable: true, description: 'null when there are no runs' }
        p95_ok: { type: boolean, nullable: true }
    AdminUsage:
      type: object
      required: [window_days, active_window_minutes, active_users, accounts, projects, archived_projects, storage_bytes, storage_limit_bytes, storage_warning, limits, generation, events]
      properties:
        window_days: { type: integer }
        active_window_minutes: { type: integer }
        active_users: { type: integer }
        accounts: { type: integer, description: Accounts that are not deactivated }
        projects: { type: integer, description: Deleted projects are not counted }
        archived_projects: { type: integer }
        storage_bytes: { type: integer }
        storage_limit_bytes: { type: integer }
        storage_warning: { type: boolean, description: 80% of the limit or more }
        limits:
          type: object
          required: [max_document_bytes, max_documents_per_project, max_pages_per_project]
          properties:
            max_document_bytes: { type: integer }
            max_documents_per_project: { type: integer }
            max_pages_per_project: { type: integer }
        generation: { $ref: '#/components/schemas/UsageGeneration' }
        events: { type: array, items: { $ref: '#/components/schemas/UsageEvent' } }
    AdminErrorType: { type: string, enum: [api, job, ai, rate_limit], description: 'api = a crash in a route, job = a failed job, ai = a failed AI call' }
    AdminErrorSeverity: { type: string, enum: [error, warning] }
    AdminError:
      type: object
      required: [id, type, severity, message, project_id, at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/AdminErrorType' }
        severity: { $ref: '#/components/schemas/AdminErrorSeverity' }
        message: { type: string, description: 'Built from kinds and class names, e.g. "ValueError in POST /projects/{project_id}/generate"' }
        project_id: { type: string, nullable: true }
        at: { type: string, format: date-time }
    AdminErrorPage:
      type: object
      required: [errors, total, page, page_size]
      properties:
        errors: { type: array, items: { $ref: '#/components/schemas/AdminError' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    ActivityEvent:
      type: object
      required: [id, action, group, actor_id, actor_email, subject_email, target, detail, at]
      properties:
        id: { type: string }
        action: { type: string, description: 'member.invited, member.joined, role.changed, member.removed, member.left, statement.edited, statement.conflict_saved, comment.created, comment.resolved, diagram.saved, diagram.regenerated, ...' }
        group: { type: string, nullable: true, enum: [members, requirements, diagrams, comments], description: Which filter the action belongs to }
        actor_id: { type: string, description: Who did it (a user id) }
        actor_email: { type: string, nullable: true }
        subject_email: { type: string, nullable: true, description: 'Who it was done to (invited, role changed, removed)' }
        target: { type: string, nullable: true, description: 'What it was done to, e.g. "R-004 - rev 3"' }
        detail: { type: object, nullable: true, additionalProperties: true, description: IDs and small values only }
        at: { type: string, format: date-time }
    ActivityActor:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
    ActivityPage:
      type: object
      required: [events, actors, total, page, page_size]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
        actors: { type: array, items: { $ref: '#/components/schemas/ActivityActor' }, description: Everyone who appears in this project's log, for the person filter }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    NotificationType: { type: string, enum: [invitation, admin_invited, mention, generation_ready, generation_failed] }
    NotificationInvitation:
      type: object
      required: [id, role, email, status, expires_at]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string }
        status: { type: string, enum: [open, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, type, payload, read_at, created_at, project, from_user, invitation]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/NotificationType' }
        payload: { type: object, additionalProperties: { type: string }, description: IDs only, never requirement or comment text }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        project:
          oneOf: [{ type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, { type: 'null' }]
        from_user:
          oneOf: [{ type: object, required: [id, email], properties: { id: { type: string }, email: { type: string } } }, { type: 'null' }]
        invitation: { oneOf: [{ $ref: '#/components/schemas/NotificationInvitation' }, { type: 'null' }] }
    NotificationList:
      type: object
      required: [unread_count, items]
      properties:
        unread_count: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
    UnreadCount:
      type: object
      required: [count]
      properties: { count: { type: integer } }
    Invitation:
      type: object
      required: [id, project_id, email, role, invited_by, created_at, expires_at, token]
      properties:
        id: { type: string }
        project_id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by:
          type: object
          required: [id, email]
          properties: { id: { type: string }, email: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        token: { type: [string, 'null'], description: The secret in the invitation link; null unless you may manage invitations }
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
    InvitationAccept:
      type: object
      required: [token]
      properties: { token: { type: string } }
    DriftWarning:
      type: object
      required: [id, kind, element_id, label, statement_id, ref, message]
      properties:
        id: { type: string }
        kind: { type: string, enum: [element_removed, relationship_added] }
        element_id: { type: string }
        label: { type: string }
        statement_id: { type: [string, 'null'] }
        ref: { type: [string, 'null'] }
        message: { type: string }
    Drift:
      type: object
      required: [baseline_id, warnings]
      properties:
        baseline_id: { type: [string, 'null'], description: The diagram as first generated; null when this version is that one }
        warnings: { type: array, items: { $ref: '#/components/schemas/DriftWarning' } }
    NamingUse:
      type: object
      required: [label, diagrams]
      properties:
        label: { type: string }
        diagrams:
          type: array
          items:
            type: object
            required: [diagram_id, title]
            properties: { diagram_id: { type: string }, title: { type: string }, version: { type: [integer, 'null'] } }
    NamingIssue:
      type: object
      required: [model_item_id, names, item_name]
      properties:
        model_item_id: { type: string }
        names: { type: array, items: { $ref: '#/components/schemas/NamingUse' } }
        item_name: { type: [string, 'null'] }
    NamingReport:
      type: object
      required: [issues]
      properties: { issues: { type: array, items: { $ref: '#/components/schemas/NamingIssue' } } }
    NamingApply:
      type: object
      required: [model_item_id, name]
      properties:
        model_item_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
    NamingApplied:
      type: object
      required: [updated]
      properties:
        updated:
          type: array
          items:
            type: object
            required: [id, type, title, version]
            properties: { id: { type: string }, type: { $ref: '#/components/schemas/DiagramType' }, title: { type: string }, version: { type: integer } }
