# FE DRAFT of the H1 / X16 contract — NOT the source of truth.
# The frontend's stubs (src/mocks) and generated types (src/api/schema.d.ts) are built from this file
# until the backend publishes its FastAPI OpenAPI schema. Then run:
#   OPENAPI_URL=https://<api-host>/openapi.json npm run gen:api
# and delete this file. Every shape here is a proposal for BE to accept, rename or reject.
openapi: 3.1.0
info:
  title: SDDG API (frontend draft)
  version: 0.1.0-draft
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /me/consent:
    get:
      summary: Current AI-processing consent (NFR5d)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
    post:
      summary: Record consent with timestamp and policy version (X8)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentCreate' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }
  /projects:
    get:
      summary: Projects the caller is a member of (FR3c)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } }
    post:
      summary: Create a project; the creator becomes Owner (FR3a)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '409': { description: Name already used by this owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { description: Not found or no access (NFR4), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/inputs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Submit pasted requirement text (FR1a) and start extraction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InputCreate' } } }
      responses:
        '202': { description: Extraction queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/statements:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Requirement statements R-001… (FR4g)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RequirementStatement' } } } }
    post:
      summary: Add a requirement (next R-number). Clears the confirmation and the building blocks.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementWrite' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/RequirementStatement' } } } }
  /projects/{project_id}/statements/{statement_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: statement_id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Edit a requirement; 422 "Requirement text can't be empty."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StatementWrite' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequirementStatement' } } } }
    delete:
      responses:
        '204': { description: Deleted }
  /projects/{project_id}/flags:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Requirement quality flags (issue #34). Advisory only; never blocks anything.
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, resolved] } }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/summary:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Per requirement flag counts, for the flag icon next to each statement
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FlagSummary' } } } }
  /projects/{project_id}/flags/{flag_id}/resolve:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/{flag_id}/reopen:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/flags/{flag_id}/apply-fix:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: flag_id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Replace the requirement text with the suggestion and resolve the flag; 409 if there is no suggestion
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/items:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Extracted items, paginated (FR5a)
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ItemCategory' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ItemPage' } } } }
  /projects/{project_id}/items/{item_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: item_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit an item; origin becomes user-edited (FR5b) and confirmation is cleared (FR5e)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractedItem' } } } }
  /projects/{project_id}/confirmation:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Confirm the current extraction (FR5e)
      responses:
        '201': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /projects/{project_id}/generations:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: Start a generation run with a locked diagram-type selection (FR9d)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerationCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { description: Extraction not confirmed (FR5e), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/stories:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every story (by S-number) and the project's members, for the assignee picker (any member)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StoryList' } } } }
    post:
      summary: Add a story; 422 with a readable detail, e.g. "A story must link to at least one requirement."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StoryCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Story' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/stories/{story_id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: story_id, in: path, required: true, schema: { type: string } }]
    patch:
      summary: Change any of a story's fields; a field left out is unchanged
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StoryUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Story' } } } }
        '422': { description: Refused, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a story; its S-number is not reused
      responses:
        '204': { description: Deleted }
  /projects/{project_id}/diagrams:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DiagramSummary' } } } }
  /projects/{project_id}/diagrams/export:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: The project's diagrams as one ZIP (PNG, SVG, PDF and source code for each, plus README.txt; no PDF for Mermaid)
      parameters:
        - { name: versions, in: query, required: false, description: 'all (default) = every version; latest = newest version of each diagram', schema: { type: string, enum: [all, latest], default: all } }
      responses:
        '200': { description: ZIP file, content: { application/zip: { schema: { type: string, format: binary } } } }
        '404': { description: The project has no diagrams yet, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'versions is not all/latest, or the all-versions ZIP is over the version cap (ZIP_MAX_VERSIONS, default 30)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /jobs/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Job status, polled by the progress indicator (FR10g)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  /diagrams/{diagram_id}:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: One diagram version. The picture itself is the PNG from /export.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
  /diagrams/{diagram_id}/revisions:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    post:
      summary: Edit a diagram in plain language ("rename Browse canteen menu to Browse menu card"). Returns the new version; the old one is kept.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RevisionCreate' } } }
      responses:
        '201': { description: New version, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
        '422': { description: The instruction could not be applied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/export:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: The rendered diagram as PNG (shown in the viewer; FR18a — 2x, capped at 8000 px), SVG or PDF, downloaded by Export. Pictures are drawn with the diagram's saved style (#38).
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [png, svg, pdf, source] } }
      responses:
        '200':
          description: File
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { description: 'format=source: the diagram code (text/x-plantuml, text/vnd.graphviz or text/x-mermaid)', schema: { type: string } }
        '422': { description: Unsupported format, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/layout:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: Element positions and the lines between them, for moving elements by hand (#37). Positions are element centres.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramLayout' } } } }
    post:
      summary: Save moved elements. Returns the new version; the one it came from is kept.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LayoutUpdate' } } }
      responses:
        '201': { description: New version, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }
        '422': { description: Not an element of this diagram, or a position is not a number, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/flags/{flag_id}/answer:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: flag_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Answer a flag's question (#34). For an untestable flag the answer also fills in the suggested requirement.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FlagAnswer' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Flag' } } } }
  /projects/{project_id}/tests/requirements:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every requirement with its test-design summary, plus the project's running test job if there is one
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRequirementList' } } } }
  /projects/{project_id}/tests/requirements/{statement_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/StatementId' }
    get:
      summary: One requirement's test design - criteria, conditions with classes and boundaries, flows, drafts, open question
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestDesign' } } } }
  /projects/{project_id}/tests/criteria-jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: AI request 1 - acceptance criteria, conditions, flows and questions for the chosen requirements (5 per AI call). Replaces an earlier design.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriteriaJobCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: A Tests job is already running for this project, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Unknown requirement, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/conditions/{condition_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: condition_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a condition. Classes, boundaries and draft cases are recomputed in code - no AI call.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConditionUpdate' } } }
      responses:
        '200': { description: The requirement's updated design, content: { application/json: { schema: { $ref: '#/components/schemas/TestDesign' } } } }
        '422': { description: Invalid limits or values, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/criteria/{criterion_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: criterion_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit an acceptance criterion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriterionUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Criterion' } } } }
  /projects/{project_id}/tests/step-jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      summary: AI request 2 - preconditions, steps and expected results for kept draft cases only (6 per AI call)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepJobCreate' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { description: No AI consent recorded (X8), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: No kept draft cases to write, or a Tests job is already running, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/cases:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Every test case with its freshness and last result
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } }
    post:
      summary: Add a test case by hand
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /projects/{project_id}/tests/cases/{case_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/CaseId' }
    patch:
      summary: Keep or discard a draft, or edit a case's text
      description: A draft only accepts `kept`; its other fields can be edited once its steps are written (status ready).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestCaseUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
        '409': { description: A draft can only be kept or discarded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Runs, newest first, with their result counts
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestRunSummary' } } } }
    post:
      summary: Start a manual run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestRunCreate' } } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
        '422': { description: The selection is empty, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs/selection:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      summary: Which ready cases each run mode would pick, and why
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RunSelection' } } } }
  /projects/{project_id}/tests/runs/{run_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    get:
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
  /projects/{project_id}/tests/runs/{run_id}/results/{case_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/CaseId' }
    put:
      summary: Mark one case in an open run. Who marked it and when are recorded.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestResultUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        '409': { description: The run is finished, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /projects/{project_id}/tests/runs/{run_id}/finish:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      summary: Finish a run. It is kept so later runs can be compared with it.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TestRun' } } } }
  /diagrams/{diagram_id}/style:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    get:
      summary: The diagram's look (#38). A version with no saved style uses the nearest earlier version's, else the default.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } } }
    put:
      summary: Save the diagram's look. Only drawing changes; the diagram's elements and relationships never do, so no new version is made.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } } }
        '422': { description: Invalid colour, direction or font size, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /diagrams/{diagram_id}/preview:
    parameters: [{ $ref: '#/components/parameters/DiagramId' }]
    post:
      summary: Draw the diagram with a style that is not saved yet, for the live preview while customising (#38)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiagramStyle' } } }
      responses:
        '200': { description: File, content: { image/png: { schema: { type: string, format: binary } } } }
        '422': { description: Invalid colour, direction or font size, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: Supabase access token }
  parameters:
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    DiagramId: { name: diagram_id, in: path, required: true, schema: { type: string } }
    StatementId: { name: statement_id, in: path, required: true, schema: { type: string } }
    CaseId: { name: case_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: Plain-language message safe to show the user }
        code: { type: string }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok] } }
    Consent:
      type: object
      required: [consented, current_policy_version]
      properties:
        consented: { type: boolean, description: True only if consent matches the current AI section of the policy }
        policy_version: { type: [string, 'null'] }
        consented_at: { type: [string, 'null'], format: date-time }
        current_policy_version: { type: string }
    ConsentCreate:
      type: object
      required: [policy_version]
      properties: { policy_version: { type: string } }
    Role: { type: string, enum: [owner, editor, viewer] }
    Project:
      type: object
      required: [id, name, role, is_owner, archived_at, archived_by, client_name, contact_email, created_at, updated_at, statement_count, item_count, extraction, confirmed, diagram_count, extracted_nodes]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: '#/components/schemas/Role' }
        is_owner: { type: boolean, description: Only the owner may rename, archive, delete or set the client }
        archived_at: { type: [string, 'null'], format: date-time }
        archived_by: { type: [string, 'null'], description: E-mail of the user who archived it }
        client_name: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        statement_count: { type: integer }
        item_count: { type: integer }
        extraction: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: Latest extraction job }
        confirmed: { type: boolean, description: The requirements are confirmed (cleared by any requirement change) }
        confirmed_at: { type: [string, 'null'], format: date-time }
        diagram_count: { type: integer }
        open_flag_count: { type: integer }
        extracted_nodes: { type: array, items: { type: string }, description: 'Extraction nodes already run on the confirmed requirements (actors, entities, ...)' }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        client_name: { type: [string, 'null'], maxLength: 100 }
        contact_email: { type: [string, 'null'], maxLength: 254 }
    ProjectRename:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 100 } }
    InputCreate:
      type: object
      required: [text]
      properties: { text: { type: string, minLength: 1 } }
    SourceLocation:
      type: object
      required: [document]
      properties:
        document: { type: string }
        page: { type: [integer, 'null'] }
        paragraph: { type: [integer, 'null'] }
    RequirementStatement:
      type: object
      required: [id, ref, text, source]
      properties:
        id: { type: string }
        ref: { type: string, description: Project-unique, never reused, e.g. R-001 }
        text: { type: string }
        label: { type: [string, 'null'], description: Label the input already carried, e.g. FR3 }
        source: { $ref: '#/components/schemas/SourceLocation' }
    StatementWrite:
      type: object
      properties:
        text: { type: string, maxLength: 2000 }
        label: { type: [string, 'null'], enum: [functional, non_functional, user_story, constraint, unknown, null] }
    FlagSummary:
      type: object
      required: [statement_id, statement_ref, total, open, types]
      properties:
        statement_id: { type: string }
        statement_ref: { type: string }
        total: { type: integer }
        open: { type: integer }
        types: { type: array, items: { $ref: '#/components/schemas/FlagType' } }
    ItemCategory:
      type: string
      enum: [actor, entity, process, data_flow, data_store, interaction, relationship]
    ItemOrigin:
      type: string
      enum: [system-extracted, user-added, user-edited]
    ItemQualifier:
      type: string
      enum: [minimal, low-confidence, incomplete, order-uncertain, needs-review]
    ExtractedItem:
      type: object
      required: [id, category, name, origin, qualifiers, statement_ids]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/ItemCategory' }
        name: { type: string }
        description: { type: [string, 'null'] }
        origin: { $ref: '#/components/schemas/ItemOrigin' }
        qualifiers: { type: array, items: { $ref: '#/components/schemas/ItemQualifier' } }
        statement_ids: { type: array, items: { type: string }, description: Source requirement statement IDs }
        source_item_id: { type: [string, 'null'], description: For flows, interactions, relationships }
        target_item_id: { type: [string, 'null'] }
        relation_type: { type: [string, 'null'], description: e.g. association, include, extend, generalization }
    ItemPage:
      type: object
      required: [items, total, page, page_size, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExtractedItem' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        counts: { type: object, additionalProperties: { type: integer }, description: Item count per category }
    ItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
    DiagramType:
      type: string
      enum: [use_case, class, activity, sequence, dfd, component, package]
      description: package = drawn from the confirmed subsystem decomposition (Design step), never generated
    GenerationCreate:
      type: object
      required: [diagram_types]
      properties:
        diagram_types: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DiagramType' } }
    JobStatus: { type: string, enum: [queued, running, waiting, succeeded, failed], description: 'waiting = the AI provider is at its rate limit; the job resumes by itself' }
    Job:
      type: object
      required: [id, kind, status, progress]
      properties:
        id: { type: string }
        kind: { type: string, enum: [extraction, generation, test_criteria, test_steps] }
        status: { $ref: '#/components/schemas/JobStatus' }
        queue_position: { type: [integer, 'null'] }
        progress:
          type: object
          required: [step, total, label]
          properties:
            step: { type: integer }
            total: { type: integer }
            label: { type: string, description: 'e.g. "Generating diagram 1 of 1"' }
        diagram_types: { type: array, items: { $ref: '#/components/schemas/DiagramType' } }
        diagram_ids: { type: array, items: { type: string } }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    DiagramSummary:
      type: object
      required: [id, type, title, created_at, parent_id, instruction]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/DiagramType' }
        title: { type: string }
        created_at: { type: string, format: date-time }
        parent_id: { type: [string, 'null'], description: The version this one was edited from; null for a fresh generation }
        instruction: { type: [string, 'null'], description: The edit request that produced this version; null for a fresh generation }
    DiagramElement:
      type: object
      required: [element_id, kind, label, statement_ids]
      properties:
        element_id: { type: string, description: Matches data-element-id in the SVG }
        model_item_id: { type: [string, 'null'] }
        kind: { type: string }
        label: { type: string }
        statement_ids: { type: array, items: { type: string } }
    Diagram:
      allOf:
        - $ref: '#/components/schemas/DiagramSummary'
        - type: object
          properties:
            svg: { type: [string, 'null'], description: 'Rendered SVG; elements are wrapped in g with data-element-id' }
            elements: { type: array, items: { $ref: '#/components/schemas/DiagramElement' } }
            statements: { type: array, items: { $ref: '#/components/schemas/RequirementStatement' }, description: Requirements this diagram traces to }
    RevisionCreate:
      type: object
      required: [instruction]
      properties:
        instruction: { type: string, minLength: 1, maxLength: 500 }
    LayoutDirection:
      type: string
      enum: [auto, TB, LR]
      description: auto keeps the direction the generator chose; TB is top to bottom, LR left to right
    DiagramStyle:
      type: object
      required: [preset, background, fill, text, line, direction, font_size]
      properties:
        preset: { type: [string, 'null'], enum: [default, high_contrast, dark, blueprint, warm, null], description: Preset the colours came from; null once a colour is edited by hand }
        background: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Canvas }
        fill: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Element boxes }
        text: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: All labels }
        line: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Borders and arrows }
        direction: { $ref: '#/components/schemas/LayoutDirection' }
        font_size: { type: integer, minimum: 8, maximum: 24, description: Points }
    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    LayoutElement:
      type: object
      required: [id, kind, label, x, y]
      properties:
        id: { type: string }
        kind: { type: string, description: 'e.g. actor, use_case, class, process, start, decision' }
        label: { type: string }
        x: { type: number, description: Centre of the element }
        y: { type: number, description: Centre of the element }
    LayoutLine:
      type: object
      required: [id, kind, source, target]
      properties:
        id: { type: string }
        kind: { type: string, description: 'e.g. association, include, extend, message, data_flow, flow, or a class relation type' }
        source: { type: string, description: Element id the line starts at }
        target: { type: string, description: Element id the line ends at }
        label: { type: [string, 'null'], description: 'Text drawn on the line: a flow name, message, relation name, dependency label, transition event or decision guard; null when the line has none' }
    DiagramLayout:
      type: object
      required: [diagram_id, type, saved, elements, lines]
      properties:
        diagram_id: { type: string }
        type: { $ref: '#/components/schemas/DiagramType' }
        saved: { type: boolean, description: True when this version has positions moved by hand; false means the default grid }
        elements: { type: array, items: { $ref: '#/components/schemas/LayoutElement' } }
        lines: { type: array, items: { $ref: '#/components/schemas/LayoutLine' } }
    LayoutUpdate:
      type: object
      required: [positions]
      properties:
        positions: { type: object, description: Only the elements that moved, by element id, additionalProperties: { $ref: '#/components/schemas/Point' } }
    StoryPriority: { type: string, enum: [must, should, could, wont] }
    StoryStatus: { type: string, enum: [todo, in_progress, done] }
    Story:
      type: object
      required: [id, ref, role, goal, reason, priority, estimate, status, assignee_id, assignee_email, confirmations, statement_ids, created_at, updated_at]
      properties:
        id: { type: string }
        ref: { type: string, description: 'Project-unique, never reused, e.g. S-001' }
        role: { type: string }
        goal: { type: string }
        reason: { type: string }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], description: Story points }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        assignee_email: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, description: Acceptance criteria }
        statement_ids: { type: array, items: { type: string }, description: Empty once its requirements were deleted }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoryCreate:
      type: object
      required: [role, goal, reason, statement_ids]
      properties:
        role: { type: string, minLength: 1, maxLength: 300 }
        goal: { type: string, minLength: 1, maxLength: 300 }
        reason: { type: string, minLength: 1, maxLength: 300 }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, maxItems: 20 }
        statement_ids: { type: array, items: { type: string }, minItems: 1 }
    StoryUpdate:
      type: object
      description: A field left out is unchanged; null clears estimate or assignee_id
      properties:
        role: { type: string, minLength: 1, maxLength: 300 }
        goal: { type: string, minLength: 1, maxLength: 300 }
        reason: { type: string, minLength: 1, maxLength: 300 }
        priority: { $ref: '#/components/schemas/StoryPriority' }
        estimate: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/StoryStatus' }
        assignee_id: { type: [string, 'null'] }
        confirmations: { type: array, items: { type: string }, maxItems: 20 }
        statement_ids: { type: array, items: { type: string }, minItems: 1 }
    StoryList:
      type: object
      required: [stories, members]
      properties:
        stories: { type: array, items: { $ref: '#/components/schemas/Story' } }
        members:
          type: array
          items: { type: object, required: [id, email], properties: { id: { type: string }, email: { type: string } } }
    FlagType: { type: string, enum: [ambiguous, incomplete, conflict, untestable] }
    Flag:
      type: object
      required: [id, statement_id, statement_ref, type, reason, status, has_suggestion, suggestion]
      properties:
        id: { type: string }
        statement_id: { type: string }
        statement_ref: { type: string }
        type: { $ref: '#/components/schemas/FlagType' }
        statement_text: { type: string }
        reason: { type: string }
        trigger_text: { type: [string, 'null'] }
        related_statement_id: { type: [string, 'null'] }
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        has_suggestion: { type: boolean }
        suggestion: { type: string, description: 'The suggested requirement text, or "No suggestion available."' }
        status: { type: string, enum: [open, resolved] }
        resolved_by: { type: [string, 'null'] }
        resolved_at: { type: [string, 'null'], format: date-time }
    FlagAnswer:
      type: object
      required: [answer]
      properties: { answer: { type: string, minLength: 1, maxLength: 1000 } }
    TestRequirementSummary:
      type: object
      required: [statement_id, ref, text, designed, stale, criteria_count, draft_count, kept_count, ready_count, boundary_count, open_question, open_flags]
      properties:
        statement_id: { type: string }
        ref: { type: string }
        text: { type: string }
        label: { type: [string, 'null'] }
        designed: { type: boolean, description: AI request 1 has run for this requirement }
        stale: { type: boolean, description: The requirement text changed after its design was made }
        criteria_count: { type: integer }
        draft_count: { type: integer, description: Generated cases still waiting for steps }
        kept_count: { type: integer, description: Drafts that will get steps }
        ready_count: { type: integer, description: Cases with steps written }
        boundary_count: { type: integer, description: Boundary values across this requirement's conditions }
        open_question: { type: boolean, description: An open untestable flag is waiting for an answer }
        open_flags: { type: array, items: { $ref: '#/components/schemas/FlagType' }, description: Types of the requirement's open flags }
    TestRequirementList:
      type: object
      required: [requirements, active_job]
      properties:
        requirements: { type: array, items: { $ref: '#/components/schemas/TestRequirementSummary' } }
        active_job: { oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }], description: A queued or running test job }
    Criterion:
      type: object
      required: [id, given, when, then]
      properties:
        id: { type: string }
        given: { type: string }
        when: { type: string }
        then: { type: string }
    ConditionKind: { type: string, enum: [range, count, set] }
    EquivalenceClass:
      type: object
      required: [label, valid]
      properties:
        label: { type: string, description: 'e.g. "1–30", "< 1", "Surgery"' }
        valid: { type: boolean }
    BoundaryValue:
      type: object
      required: [value, valid]
      properties:
        value: { type: number }
        valid: { type: boolean, description: False when the system should reject this value }
    Condition:
      type: object
      required: [id, name, kind, description, values, invalid_values, classes, boundaries]
      properties:
        id: { type: string }
        name: { type: string, description: 'The input, e.g. days_ahead' }
        kind: { $ref: '#/components/schemas/ConditionKind' }
        description: { type: string }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }
        values: { type: array, items: { type: string }, description: Valid values of a set }
        invalid_values: { type: array, items: { type: string }, description: Values a set must reject }
        classes: { type: array, items: { $ref: '#/components/schemas/EquivalenceClass' } }
        boundaries: { type: array, items: { $ref: '#/components/schemas/BoundaryValue' } }
    Flow:
      type: object
      required: [id, kind, text]
      properties:
        id: { type: string }
        kind: { type: string, enum: [basic, alternate] }
        text: { type: string }
    PerformanceTarget:
      type: object
      required: [measure, limit, unit]
      properties:
        measure: { type: string }
        limit: { type: number }
        unit: { type: string }
        load: { type: [string, 'null'] }
    TestDesign:
      type: object
      required: [statement_id, ref, text, designed, stale, criteria, conditions, flows, performance_targets, drafts, question, open_flags]
      properties:
        statement_id: { type: string }
        ref: { type: string }
        text: { type: string }
        label: { type: [string, 'null'] }
        designed: { type: boolean }
        stale: { type: boolean }
        generated_at: { type: [string, 'null'], format: date-time }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        flows: { type: array, items: { $ref: '#/components/schemas/Flow' } }
        performance_targets: { type: array, items: { $ref: '#/components/schemas/PerformanceTarget' } }
        drafts: { type: array, items: { $ref: '#/components/schemas/TestCase' }, description: This requirement's generated cases }
        question: { oneOf: [{ $ref: '#/components/schemas/Flag' }, { type: 'null' }], description: The latest untestable flag }
        open_flags: { type: array, items: { $ref: '#/components/schemas/FlagType' } }
    CriteriaJobCreate:
      type: object
      required: [statement_ids]
      properties:
        statement_ids: { type: array, minItems: 1, maxItems: 30, items: { type: string } }
    ConditionUpdate:
      type: object
      properties:
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        values: { type: array, items: { type: string } }
        invalid_values: { type: array, items: { type: string } }
    CriterionUpdate:
      type: object
      required: [given, when, then]
      properties:
        given: { type: string, minLength: 1, maxLength: 500 }
        when: { type: string, minLength: 1, maxLength: 500 }
        then: { type: string, minLength: 1, maxLength: 500 }
    StepJobCreate:
      type: object
      properties:
        case_ids: { type: array, items: { type: string }, description: Defaults to every kept draft case }
    CaseTechnique: { type: string, enum: [EC, BVA, BVA+EC, Flow, NFR, AC, Manual] }
    CaseKind: { type: string, enum: [positive, negative, edge] }
    CasePriority: { type: string, enum: [high, medium, low] }
    ResultStatus: { type: string, enum: [pass, fail, blocked, skipped] }
    TestCase:
      type: object
      required: [id, number, statement_id, statement_ref, title, technique, kind, priority, status, kept, origin, test_data, covers, preconditions, steps, freshness, created_at]
      properties:
        id: { type: string }
        number: { type: string, description: 'Project-unique, never reused, e.g. TC-009' }
        statement_id: { type: string }
        statement_ref: { type: string }
        title: { type: string }
        technique: { $ref: '#/components/schemas/CaseTechnique' }
        kind: { $ref: '#/components/schemas/CaseKind' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        status: { type: string, enum: [draft, ready], description: ready once steps are written }
        kept: { type: boolean, description: False for a draft the user unticked }
        origin: { type: string, enum: [generated, manual] }
        outcome: { type: [string, 'null'], enum: [accepted, rejected, null], description: What the system should do with the test data }
        test_data: { type: object, additionalProperties: { type: [string, number] } }
        covers: { type: array, items: { type: string }, description: 'e.g. EC:days_ahead:high, BVA:days_ahead:31' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        expected: { type: [string, 'null'] }
        freshness: { type: string, enum: [current, out_of_date], description: out_of_date once the requirement text changes }
        last_result: { oneOf: [{ $ref: '#/components/schemas/ResultStatus' }, { type: 'null' }], description: Result in the newest run that marked this case }
        created_at: { type: string, format: date-time }
    TestCaseCreate:
      type: object
      required: [statement_id, title, kind, priority, steps, expected]
      properties:
        statement_id: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/CaseKind' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, minItems: 1, items: { type: string } }
        expected: { type: string, minLength: 1, maxLength: 1000 }
    TestCaseUpdate:
      type: object
      properties:
        kept: { type: boolean }
        title: { type: string, minLength: 1, maxLength: 200 }
        priority: { $ref: '#/components/schemas/CasePriority' }
        preconditions: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }
        expected: { type: string, minLength: 1, maxLength: 1000 }
    RunMode: { type: string, enum: [all, failed, regression, minimal, pick] }
    TestRunCreate:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        mode: { $ref: '#/components/schemas/RunMode' }
        case_ids: { type: array, items: { type: string }, description: Required for mode pick }
    RunTally:
      type: object
      required: [pass, fail, blocked, skipped, unmarked]
      properties:
        pass: { type: integer }
        fail: { type: integer }
        blocked: { type: integer }
        skipped: { type: integer }
        unmarked: { type: integer }
    TestRunSummary:
      type: object
      required: [id, name, mode, case_count, created_by, created_at, finished_at, tally]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { $ref: '#/components/schemas/RunMode' }
        case_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        tally: { $ref: '#/components/schemas/RunTally' }
    TestResult:
      type: object
      required: [case_id, status, marked_by, marked_at]
      properties:
        case_id: { type: string }
        status: { $ref: '#/components/schemas/ResultStatus' }
        note: { type: [string, 'null'] }
        marked_by: { type: string }
        marked_at: { type: string, format: date-time }
    TestRunItem:
      type: object
      required: [case, result]
      properties:
        case: { $ref: '#/components/schemas/TestCase' }
        result: { oneOf: [{ $ref: '#/components/schemas/TestResult' }, { type: 'null' }] }
    TestRun:
      allOf:
        - { $ref: '#/components/schemas/TestRunSummary' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/TestRunItem' } }
    TestResultUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ResultStatus' }
        note: { type: [string, 'null'], maxLength: 1000 }
    RunSelectionMode:
      type: object
      required: [case_ids, reasons, warning]
      properties:
        case_ids: { type: array, items: { type: string }, description: In the order the run will show them }
        reasons: { type: object, additionalProperties: { type: string }, description: Why each case was picked, by case id }
        warning: { type: [string, 'null'] }
    RunSelection:
      type: object
      required: [changed_refs, all, failed, regression, minimal]
      properties:
        changed_refs: { type: array, items: { type: string }, description: Requirements whose text changed since their cases were made }
        all: { $ref: '#/components/schemas/RunSelectionMode' }
        failed: { $ref: '#/components/schemas/RunSelectionMode' }
        regression: { $ref: '#/components/schemas/RunSelectionMode' }
        minimal: { $ref: '#/components/schemas/RunSelectionMode' }
