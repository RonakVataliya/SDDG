# Real-LLM eval (plan 1.1): manual or nightly; needs GROQ_API_KEY / GOOGLE_API_KEY repository secrets.
# Not part of CI: it costs provider quota and its scores move with the model.
name: Eval

on:
  workflow_dispatch:
    inputs:
      provider: { description: "groq or gemini", default: groq, required: true }
      docs: { description: "'all' or comma-separated ids", default: all, required: true }
      repeat: { description: "runs per document", default: "3", required: true }
  schedule:
    - cron: "17 21 * * *"  # 02:47 IST, outside demo hours

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: services/ai-extraction
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-extraction/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m evals.run --provider "${{ inputs.provider || 'groq' }}" --docs "${{ inputs.docs || 'all' }}" --repeat "${{ inputs.repeat || '3' }}" --out eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: services/ai-extraction/eval-report.json
